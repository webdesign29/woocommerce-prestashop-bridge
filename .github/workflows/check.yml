name: PHP checks
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -e
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -name '*.php' -not -path './vendor/*' -print0)
      - name: Protocol regression checks
        run: php tests/protocol.php
      - name: Manual order regression checks
        run: php tests/manual-orders.php
      - name: Product and contact manual sync checks
        run: php tests/manual-records.php
      - name: Native customer conflict guard checks
        run: php tests/customer-record-guard.php
      - name: Bounded process and compatibility checks
        run: php tests/processes.php
      - name: Admin context regression checks
        run: php tests/admin-context.php
      - name: Product link and editor authorization checks
        run: |
          php tests/product-links.php
          php tests/product-links-admin.php
      - name: Single-record workspace checks
        run: |
          php tests/record-panel.php
          php tests/record-panel-admin.php
          node --check includes/record-panel.js
          node --check includes/product-links.js
      - name: Build installation archive
        run: python3 scripts/package.py
